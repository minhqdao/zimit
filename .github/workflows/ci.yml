name: CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

env:
    ZIG_VERSION: "0.16.0"
    ZLS_VERSION: "0.16.0"
    ZLS_LINUX_X86_64_SHA256: ded6d562a0b86ee878b1ddf70ffab2797ce3cdca3b02d6077548f9d56dff96b6

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}
            - run: zig fmt --check src/ examples/ build.zig

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}
            - name: Install ZLS
              run: |
                  mkdir -p "${RUNNER_TEMP}/zls"
                  archive="${RUNNER_TEMP}/zls-x86_64-linux.tar.xz"
                  curl --fail --location \
                    --output "${archive}" \
                    "https://github.com/zigtools/zls/releases/download/${ZLS_VERSION}/zls-x86_64-linux.tar.xz"
                  echo "${ZLS_LINUX_X86_64_SHA256}  ${archive}" | sha256sum --check --strict
                  tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}/zls"
                  echo "${RUNNER_TEMP}/zls" >> "${GITHUB_PATH}"
            - name: Run ZLS lint
              run: python3 tools/zls_lint.py

    test:
        name: ${{ matrix.os }} - Debug validation
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, macos-latest, windows-latest ]
        steps:
            - uses: actions/checkout@v7
            - uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}
            - run: zig build test --summary all
            - run: zig build examples --summary all
            - name: Build global limiter example standalone
              working-directory: examples/global-limiter
              run: zig build --summary all
            - name: Build waiting global limiter example standalone
              working-directory: examples/global-limiter-wait
              run: zig build --summary all
            - name: Build rate limiter example standalone
              working-directory: examples/rate-limiter
              run: zig build --summary all
            - run: zig build docs # just verifying they build

    release-safe:
        name: ubuntu-latest - ReleaseSafe validation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: mlugg/setup-zig@v2
              with:
                  version: ${{ env.ZIG_VERSION }}
            - run: zig build test -Doptimize=ReleaseSafe --summary all
            - run: zig build examples -Doptimize=ReleaseSafe --summary all
